name: rfqsa_mobile
description: "تطبيق رفق الموحد لقطع غيار السيارات - Single Codebase Multi-Role Mobile App (Client, Vendor, Courier)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & Realtime
  dio: ^5.4.3+1
  supabase_flutter: ^2.5.6
  web_socket_channel: ^2.4.5

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Audio & Custom Sound Alerts
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.1.2
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  permission_handler: ^11.3.1

  # Location, Geocoding & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.6

  # Media: Camera, Image Picker, Compression & Voice Recorder
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  record: ^5.2.0
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1

  # UI Components & Utilities
  intl: ^0.20.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  animate_do: ^3.3.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23

dependency_overrides:
  record_linux: 0.7.1
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
